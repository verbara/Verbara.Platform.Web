# Stub upstream for scripts/web-image/check-nginx.sh. One nginx container answers
# for both of the web image's upstreams on a throwaway Docker network:
#   :5000 as platform-api (a user with a strong ETag, an SSE path that fails);
#   :5030 as the realtime service (SignalR negotiate).
# Compression stays off here (the stock nginx.conf leaves gzip commented out),
# so any Content-Encoding or weak ETag the client sees was added by the web image.

server {
    listen 5000;

    location = /api/v1/admin/users/stub-user-g8 {
        default_type application/json;
        add_header ETag '"stub-strong-etag-7f3a9c"' always;
        add_header X-Stub-Upstream api always;
        return 200 '{"id":"stub-user-g8","email":"stub.user@example.test","displayName":"Stub user served by the check","status":"active","roles":["agent"]}';
    }

    # Closes the connection without a response, so the web image answers 502
    # and nginx writes its "upstream prematurely closed" error for the request.
    location /api/v1/events/stream {
        return 444;
    }

    location / {
        return 404;
    }
}

server {
    listen 5030;

    location /hubs/ {
        default_type application/json;
        add_header X-Stub-Upstream realtime always;
        return 200 '{"negotiateVersion":1,"connectionId":"stub","connectionToken":"stub","availableTransports":[]}';
    }

    location / {
        return 404;
    }
}

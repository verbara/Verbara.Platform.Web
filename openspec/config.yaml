schema: spec-driven

context: |
  Verbara.Platform.Web — the React 19 frontend for the Verbara contact-center Platform.
  Stack: React 19 + TypeScript 6 + Vite 8, TanStack Query (server state), Zustand (client state),
  React Router 7, TailwindCSS 4.2 via @tailwindcss/vite. Modules: Admin, Agent, Analytics, Operations.
  Position in the dependency chain: Platform (API) <- Platform.Web (API-first — the API contract leads).

  Hard constraints (non-negotiable):
  - UI uses @base-ui/react, NOT Radix UI: use the `render` prop, never `asChild`.
  - i18n parity is enforced in CI: EN-US, ES-419, PT-BR must all match.
  - E2E selectors use data-* attributes (locale-proof); never assert dynamic content with toContainText.
  - `npm run build` runs type-check + bundle and must pass clean.

  Note: Platform + Platform.Web share an authoritative workstream — plans/specs/ADRs touching the API OR the
  frontend are authored under the Verbara.Platform repo's docs/ tree, AND (hub rule, verbara-meta/ADR-0005)
  OpenSpec changes + living specs describing Web behavior are hosted in Verbara.Platform/openspec/ (see
  openspec/specs/README.md here for the pointer list; e.g. ai-credits-readout). This repo's openspec exists
  for genuinely frontend-independent changes. Cross-repo standards live in the private verbara-meta repo as ADRs.

  openspec/ is the planning home since 2026-06; docs/plans/ holds ExitPlanMode-style plans only, so a quiet
  docs/plans/ tree is expected here, not drift.

rules:
  proposal:
    - 'Set a `tier` in frontmatter: GRANDE (cross-repo, >3 days, or a product decision), MEDIANO (one repo, 1-3 days), or PEQUEÑO (bug fix, <1 day). PEQUEÑO may keep the proposal light.'
    - "Add product-ownership frontmatter: owner, approver, stakeholder, decision_ref (repo-qualified ADR that motivates or records this change, e.g. Platform/ADR-0032 — Platform hosts Web-affecting ADRs under its docs/decisions/). With a single developer, owner = approver. This repo-qualification rule is not just for `decision_ref`: it governs ANY cross-repo ADR citation in ANY doc (operator decision 2026-07-05, verbara-meta/ADR-0011, three-way collision) — a bare 'ADR-NNNN' refers only to THIS repo's docs/decisions/, so citing another repo's ADR MUST be repo-qualified (e.g. 'Pro/ADR-0011', 'verbara-meta/ADR-0006')."
    - 'State the problem (what pain, for whom) for GRANDE and MEDIANO tiers.'
    - "Public-repo content rule (verbara-meta/ADR-0005, applies to ALL artifacts of a change): never include secrets/keys/tokens, customer or personal data, absolute machine paths, partner-specific commercial terms, or reproductions of private-repo content — reference private repos only as opaque names (e.g. verbara-meta/ADR-NNNN, Pro/ADR-NNNN); when in doubt the artifact goes in the private repo's docs and the public change carries the opaque reference."
  specs:
    - 'Use RFC 2119 keywords: SHALL/MUST for non-negotiable requirements, SHOULD for desirable, MAY for optional.'
    - 'Write scenarios as GIVEN/WHEN/THEN.'
    - 'Call out API-contract dependency: this is API-first, so flag the Platform endpoints/DTOs a change depends on.'
    - "Include an Architectural Risk section as an H2 heading ('## Architectural Risk', a sibling of the delta sections — NEVER a '###' header inside requirements: openspec archive rebuilds every '###' as a requirement and aborts): Level (LOW/MEDIUM/HIGH), Affected (areas/repos that can break), Mitigation. Keep SHALL/MUST on the first line of each '### Requirement:'."
  design:
    - "Reference existing ADRs when relevant. Note that Platform + Web ADRs are authored under the Verbara.Platform repo's docs/."
    - 'Honor frontend constraints: @base-ui/react (render prop, not asChild), i18n parity across EN/ES/PT, data-* E2E selectors.'
    - 'Record any durable architectural decision as an ADR in docs/decisions/, not only in this design.'
  tasks:
    - 'Verification tasks MUST include `npm run build` (type-check + bundle), `npx vitest run`, and i18n parity green.'
    - 'For user-facing flows, include `npx playwright test` coverage using data-* selectors.'
    - 'E2E/Playwright tasks MUST follow the anti-flake fences: no waitForTimeout/wall-clock waits, assert via expect(...) polling or waitForResponse, and respect the suite posture (workers:1, retries:1, data-testid selectors). AI-generated specs are held to the same rule.'
    - 'Use Subagent-Driven Development with FCM batching: Phase A foundation (batch) -> Phase B critical components (focused) -> Phase C integration (batch).'

operations:
  apply:
    guidance:
      - 'Do not check off a verification task until it actually ran: `npm run build` (type-check + bundle), `npx vitest run`, `npx eslint .`, and i18n parity green across EN-US, ES-419 and PT-BR — parity is CI-enforced, so a missing key reds the PR, not the local run.'
      - 'User-facing flows also need `npx playwright test` with `data-*` selectors. Never assert dynamic content with `toContainText` — it breaks under a locale switch.'
      - 'E2E anti-flake fences are not negotiable: no `waitForTimeout`/wall-clock waits, assert via `expect(...)` polling or `waitForResponse`, keep the suite posture (workers:1, retries:1). AI-generated specs are held to the same rule.'
      - "This repo is API-first: the behaviour contract lives in Platform's specs. If apply reveals the API shape is wrong, fix it there — never reshape the client to match an unblessed surface."
      - 'Add the `CHANGELOG.md [Unreleased]` entry in this PR; leave its `(#N)` citation for close-out.'
      - 'Conventional Commits (`feat:`/`fix:`/`docs:`/`refactor:`/`test:`/`chore:`), and never a `Co-Authored-By` trailer.'
      - 'Anything deferred or discovered mid-apply goes into `tasks.md` or an open change — never only into the PR prose, which nothing reads at close-out.'
  archive:
    guidance:
      - 'Close out with the CLI: `openspec archive <name> --yes`. Do NOT use `/opsx:archive`, `/opsx:bulk-archive` or `/opsx:sync` — the agent archive path never invokes the CLI, and its no-sync branch moves the change away with the main specs never updated (a later `validate --all --strict` still passes, because the deltas are gone).'
      - 'Add `--skip-specs` only if this change already went through a sync. On a change that never synced it silently drops the deltas.'
      - 'Before archiving: reconcile the living spec, harvest every deferred AND incidentally discovered follow-up into an open change or an ADR addendum, and check off `tasks.md`.'
      - 'Sweep referrers to the change path before the directory moves — `.github/workflows/`, `scripts/` and test fixtures, not only Markdown.'
      - "If archive aborts because this change removes a capability's LAST requirement, that is expected: add `retire_capabilities: true` to the change's `.openspec.yaml`. It DELETES the living spec — use it only for genuine retirement."
      - "Land the close-out as its own `docs(openspec):` PR; `main` is protected. Backfill the feature PR's `(#N)` citation into `CHANGELOG.md [Unreleased]` here — the number did not exist at apply time."

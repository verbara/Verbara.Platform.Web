# Release workflow: build the Verbara.Platform.Web (React + nginx) Docker image,
# push to ghcr.io, and Sigstore-cosign-sign it. Triggered by pushing a `v*` tag
# (e.g. `v3.1.4-web`, `v3.2.0-web`).
#
# Mirrors the API release workflow (`Verbara.Platform/.github/workflows/
# release.yml`) so a customer who already verifies the API image can use the
# same `cosign.pub` to verify Web. The keypair is shared across both repos by
# design (see `.github/cosign.pub` — same fingerprint as the API repo).
#
# Web-image-adoption plan (`docs/plans/active/2026-05-23-web-image-adoption.md`)
# refinements baked in here:
#   - MULTI-ARCH: builds for linux/amd64 AND linux/arm64 in one pass (QEMU
#     emulated). Web is a static nginx-served bundle so this is essentially
#     free build-side. Unlocks Mac Mini M-series, AWS Graviton, Raspberry Pi
#     5, Hetzner/OVH ARM hosts.
#   - `:latest` MUTABLE ALIAS pushed alongside the pinned `vX.Y.Z-web` tag.
#     cosign signs by manifest-list digest (NOT by tag), so the single sign
#     call covers both tag references — verifying `ghcr.io/verbara/platform/
#     web:latest` resolves to the same digest as the pinned tag at release
#     time and inherits its signature. Customers should still pin in
#     reference-smb / helm / manuales for reproducibility; `:latest` is the
#     "quick-try" onramp.
#
# Verification by a customer / operator (works for any tag — pinned or :latest):
#   cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \
#     ghcr.io/verbara/platform/web:v3.1.4-web
#
# Or by digest for absolute reproducibility:
#   cosign verify --key .github/cosign.pub --insecure-ignore-tlog \
#     ghcr.io/verbara/platform/web@sha256:<digest>
#
# Differences vs the API workflow:
#   - No NUGET auth (no private packages in the build context — pure npm).
#   - No IMAGE_DIGEST baked / authorized-digests.json registration: Pro
#     licensing image binding only applies to Platform.Api (it's the binary
#     that consumes Pro packages). Web is a static asset bundle served by
#     nginx; signature verification is sufficient.
#   - Multi-arch + :latest is currently a Web-only posture (API is amd64-only
#     because Native AOT publishes per-arch). If/when API adopts the same,
#     consider unifying via a reusable workflow.

name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: verbara/platform/web

jobs:
  release:
    name: Build, push, and sign Web image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty; cannot derive release tag" >&2
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch emulation)
        # Required so the amd64 runner can build linux/arm64 layers via
        # binfmt_misc + qemu-user-static. The action installs the missing
        # binfmt registrations on the runner; no-op if already installed.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (multi-arch + :latest alias)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          provenance: false
          # VITE_DEFAULT_TENANT_ID is a build-time hint (used as a UI default
          # in the tenant picker, not a runtime auth boundary). Left empty
          # by default so the binary is generic; operators can rebuild with
          # --build-arg VITE_DEFAULT_TENANT_ID=their-tenant if they want a
          # branded experience baked in.

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pin v2.5.2 (matches the API workflow). cosign v3.x changed the
          # detached-signature distribution model and breaks the installer
          # action's bootstrap. See API release.yml for the full rationale.
          cosign-release: 'v2.5.2'

      - name: Sign final image with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp -t cosign-key.XXXXXX)"
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          # Retry to tolerate the ghcr push→HEAD manifest-propagation race: cosign
          # signs by digest, and a just-pushed manifest can briefly 404 on the HEAD
          # lookup before ghcr finishes propagating it. The `if` condition is exempt
          # from `set -e`.
          signed=false
          for attempt in 1 2 3 4 5; do
            if cosign sign \
                 --key "$KEY_FILE" \
                 --yes \
                 --tlog-upload=false \
                 "$IMAGE_REF"; then
              signed=true
              break
            fi
            echo "::warning::cosign sign attempt ${attempt} failed (likely ghcr manifest propagation); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$signed" != "true" ]; then
            echo "::error::cosign sign failed after 5 attempts for $IMAGE_REF"
            exit 1
          fi

      - name: Verify cosign signature against committed public key
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --key .github/cosign.pub \
            --insecure-ignore-tlog \
            "$IMAGE_REF"

      - name: Print final image reference
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signed image manifest-list digest: ${{ steps.build.outputs.digest }}"
          echo "Final image reference: $IMAGE_REF"
          echo ""
          echo "Tag references (both resolve to the same digest above):"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}   (pinned — recommend for reproducible installs)"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest                                  (mutable — for quick-try / evaluation)"
          echo ""
          echo "Architectures bundled in the manifest list:"
          echo "  linux/amd64   linux/arm64"
          echo ""
          echo "Pull command for customers (auto-resolves to the host's architecture):"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}"
          echo ""
          echo "Verify signature (customer-friendly, no clone needed):"
          echo "  cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \\"
          echo "    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}"
          echo ""
          echo "This image is consumed by Verbara.Platform's docker/docker-compose.reference-smb.yml"
          echo "as the 'web' service. Pin the tag in customer-facing references; :latest is for"
          echo "ad-hoc experimentation only."

# Release workflow: build the Verbara.Platform.Web (React + nginx) Docker image,
# push to ghcr.io, and Sigstore-cosign-sign it. Triggered by pushing a `v*` tag
# (e.g. `v3.1.4-web`, `v3.2.0-web`).
#
# Mirrors the API release workflow (`Verbara.Platform/.github/workflows/
# release.yml`) so a customer who already verifies the API image can use the
# same `cosign.pub` to verify Web. The keypair is shared across both repos by
# design (see `.github/cosign.pub` — same fingerprint as the API repo).
#
# Web-image-adoption plan (`docs/plans/active/2026-05-23-web-image-adoption.md`)
# refinements baked in here:
#   - MULTI-ARCH: builds for linux/amd64 AND linux/arm64 in one pass (QEMU
#     emulated). Web is a static nginx-served bundle so this is essentially
#     free build-side. Unlocks Mac Mini M-series, AWS Graviton, Raspberry Pi
#     5, Hetzner/OVH ARM hosts.
#   - `:latest` MUTABLE ALIAS pushed alongside the pinned `vX.Y.Z-web` tag.
#     cosign signs by manifest-list digest (NOT by tag), so the single sign
#     call covers both tag references — verifying `ghcr.io/verbara/platform/
#     web:latest` resolves to the same digest as the pinned tag at release
#     time and inherits its signature. Customers should still pin in
#     reference-smb / helm / manuales for reproducibility; `:latest` is the
#     "quick-try" onramp.
#
# Verification by a customer / operator (works for any tag — pinned or :latest):
#   cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \
#     ghcr.io/verbara/platform/web:v3.1.4-web
#
# Or by digest for absolute reproducibility:
#   cosign verify --key .github/cosign.pub --insecure-ignore-tlog \
#     ghcr.io/verbara/platform/web@sha256:<digest>
#
# Differences vs the API workflow:
#   - No NUGET auth (no private packages in the build context — pure npm).
#   - No IMAGE_DIGEST baked / authorized-digests.json registration: Pro
#     licensing image binding only applies to Platform.Api (it's the binary
#     that consumes Pro packages). Web is a static asset bundle served by
#     nginx; signature verification is sufficient.
#   - Multi-arch + :latest is currently a Web-only posture (API is amd64-only
#     because Native AOT publishes per-arch). If/when API adopts the same,
#     consider unifying via a reusable workflow.
#   - Creates the GitHub Release object itself (final step). Platform's
#     `release.yml` and Sdk's `publish.yml` still do NOT — for those, `/xr:release`
#     §H creates it by hand, which is why unreleased tags accumulated here.

name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  # `contents: write` (not `read`) so the final step can create the GitHub Release
  # object for the tag. Single-job workflow, so a job-level override would scope
  # nothing — the same job builds, pushes, signs and releases.
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: verbara/platform/web

jobs:
  release:
    name: Build, push, and sign Web image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ]; then
            echo "GITHUB_REF_NAME is empty; cannot derive release tag" >&2
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch emulation)
        # Required so the amd64 runner can build linux/arm64 layers via
        # binfmt_misc + qemu-user-static. The action installs the missing
        # binfmt registrations on the runner; no-op if already installed.
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (multi-arch + :latest alias)
        id: build
        # The linux/arm64 layer builds under QEMU emulation on the amd64 runner,
        # which has hung indefinitely (~1h stuck buildx) on past releases. Fail fast
        # so the run is cancellable + auto-rerunnable instead of stalling the release.
        timeout-minutes: 25
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          provenance: false
          # VITE_DEFAULT_TENANT_ID is a build-time hint (used as a UI default
          # in the tenant picker, not a runtime auth boundary). Left empty
          # by default so the binary is generic; operators can rebuild with
          # --build-arg VITE_DEFAULT_TENANT_ID=their-tenant if they want a
          # branded experience baked in.

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pin v3.0.6 — matches the API workflow and maintainer-side cosign on
          # local builds. Web and the API share a cosign keypair, so the signer
          # and any verifier MUST run the same major: the 2026-05-23 v2.4.2
          # anomaly traced (in part) to a v2.5.2 ↔ v3.0.6 verify incompat — see
          # ADR-0024 §Process Hardening. Keep cosign aligned cross-context at v3.0.6.
          cosign-release: 'v3.0.6'

      - name: Sign final image with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$(mktemp -t cosign-key.XXXXXX)"
          SIGNING_CONFIG="$(mktemp -t signing-config.XXXXXX).json"
          trap 'shred -u "$KEY_FILE" "$SIGNING_CONFIG" 2>/dev/null || rm -f "$KEY_FILE" "$SIGNING_CONFIG"' EXIT
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$KEY_FILE"
          # cosign v3.x removed the `--tlog-upload=false` flag (it errors when a
          # signing-config is in play). To skip Rekor (Verbara's posture) we pass an
          # explicit signing-config whose rekorTlogUrls array is stripped via jq —
          # mirrors the Platform release.yml cosign-v3 migration (ADR-0024).
          curl -fsSL https://raw.githubusercontent.com/sigstore/root-signing/refs/heads/main/targets/signing_config.v0.2.json \
            | jq 'del(.rekorTlogUrls)' > "$SIGNING_CONFIG"
          # Retry to tolerate the ghcr push→HEAD manifest-propagation race: cosign
          # signs by digest, and a just-pushed manifest can briefly 404 on the HEAD
          # lookup before ghcr finishes propagating it. The `if` condition is exempt
          # from `set -e`.
          signed=false
          for attempt in 1 2 3 4 5; do
            if cosign sign \
                 --key "$KEY_FILE" \
                 --yes \
                 --signing-config "$SIGNING_CONFIG" \
                 "$IMAGE_REF"; then
              signed=true
              break
            fi
            echo "::warning::cosign sign attempt ${attempt} failed (likely ghcr manifest propagation); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$signed" != "true" ]; then
            echo "::error::cosign sign failed after 5 attempts for $IMAGE_REF"
            exit 1
          fi

      - name: Verify cosign signature against committed public key
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --key .github/cosign.pub \
            --insecure-ignore-tlog \
            "$IMAGE_REF"

      - name: Create GitHub Release
        # This workflow historically built and cosign-signed the image but never
        # created the Release object, so EVERY version reopened the gap: as of
        # 2026-07-28 the repo had 22 Release objects over 52 tags, and
        # v3.14.0-web / v3.15.0-web / v3.16.0-web had to be backfilled by hand.
        #
        # Deliberately placed AFTER `cosign sign` + `cosign verify`, so a Release
        # object can never exist for an image whose signature did not verify.
        #
        # Idempotent: `/xr:release` §H may already have created a themed Release
        # for this tag (its title carries the release theme, which this workflow
        # cannot know). If one exists, leave it alone — never overwrite an
        # operator-authored body with the generated one.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.release_tag }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release object for $TAG already exists — leaving it untouched."
            exit 0
          fi

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"

          # This version's own CHANGELOG section: everything between its heading
          # (`## [3.18.0-web] - 2026-07-27`) and the next `## [` heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::No CHANGELOG.md section found for [$VERSION] — falling back to a pointer body."
            printf 'See [`CHANGELOG.md`](https://github.com/%s/blob/main/CHANGELOG.md) for this release.\n' \
              "$GITHUB_REPOSITORY" > "$NOTES_FILE"
          fi

          # Drop trailing blank lines and any horizontal rule the section ended on,
          # so the image footer below contributes the only `---` in the body.
          awk '{ line[NR] = $0 }
               END { last = NR
                     while (last > 0 && (line[last] ~ /^[[:space:]]*$/ || line[last] == "---")) last--
                     for (i = 1; i <= last; i++) print line[i] }' "$NOTES_FILE" > "${NOTES_FILE}.trimmed"
          mv "${NOTES_FILE}.trimmed" "$NOTES_FILE"

          {
            printf '\n---\n\n'
            printf 'Signed multi-arch image (linux/amd64 + linux/arm64):\n\n'
            printf '    %s\n\n' "$IMAGE_REF"
            printf 'Verify:\n\n'
            printf '    cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \\\n'
            printf '      %s/%s:%s\n' "$REGISTRY" "$IMAGE_NAME" "$TAG"
          } >> "$NOTES_FILE"

          # Claim the `Latest` badge only when this really is the highest version
          # tag. A hotfix cut on an older line (as v3.13.1-web was) must not steal
          # it from a newer minor. Tags come from the API so no extra git fetch is
          # needed — `actions/checkout` is shallow here and carries no tag refs.
          HIGHEST="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' | sort -V | tail -1)"
          if [ "$HIGHEST" = "$TAG" ]; then LATEST=true; else LATEST=false; fi
          echo "highest tag=$HIGHEST · this tag=$TAG · --latest=$LATEST"

          gh release create "$TAG" \
            --verify-tag \
            --latest="$LATEST" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"

      - name: Print final image reference
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signed image manifest-list digest: ${{ steps.build.outputs.digest }}"
          echo "Final image reference: $IMAGE_REF"
          echo ""
          echo "Tag references (both resolve to the same digest above):"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}   (pinned — recommend for reproducible installs)"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest                                  (mutable — for quick-try / evaluation)"
          echo ""
          echo "Architectures bundled in the manifest list:"
          echo "  linux/amd64   linux/arm64"
          echo ""
          echo "Pull command for customers (auto-resolves to the host's architecture):"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}"
          echo ""
          echo "Verify signature (customer-friendly, no clone needed):"
          echo "  cosign verify --key https://verbara.io/keys/cosign.pub --insecure-ignore-tlog \\"
          echo "    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.release_tag }}"
          echo ""
          echo "This image is consumed by Verbara.Platform's docker/docker-compose.reference-smb.yml"
          echo "as the 'web' service. Pin the tag in customer-facing references; :latest is for"
          echo "ad-hoc experimentation only."

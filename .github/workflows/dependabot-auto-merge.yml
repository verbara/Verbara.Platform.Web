name: Dependabot auto-merge

# Auto-merge Dependabot PRs for safe (patch + minor) updates after CI passes.
#
# - Major updates are filtered upstream by .github/dependabot.yml — they don't
#   reach this workflow.
# - Auto-merge only completes when all required status checks (build, test,
#   i18n, audit) pass. Branch protection on `main` enforces that gate.
# - main runs a merge queue (merge_group), so the queue ruleset — not this
#   workflow — picks the merge strategy. Requires the AUTOMERGE_PAT secret.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    # Only run on Dependabot-authored PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # No merge-method flag: with the merge queue active on main, the queue
        # ruleset dictates the strategy. Passing --squash here is rejected
        # ("The merge strategy for main is set by the merge queue") and silently
        # fails to enqueue the PR. --auto simply adds it to the queue when ready.
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Use AUTOMERGE_PAT instead of GITHUB_TOKEN so the merge_group event
          # this enqueue creates is attributed to a non-bot identity. GitHub's
          # anti-recursion rule blocks workflows triggered by GITHUB_TOKEN from
          # triggering further workflows, so a queue enqueue done with
          # GITHUB_TOKEN leaves the merge_group CI checks never starting and the
          # PR stuck. See github/community#70310 and the 2026-05-22 session that
          # diagnosed this on Verbara.Sdk PR #19/#20.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}

      - name: Comment on major updates (manual review required)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version update detected. Auto-merge skipped. Manual review required (see Track 3C in v1.14.x roadmap for the deps-majors track when these are coordinated)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

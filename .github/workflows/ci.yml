name: CI

# CI for Verbara Web (formerly Asterisk.Platform.Web).
# Runs on every PR + push to main.
#
# Jobs (6 in parallel):
#   - build     blocking - tsc -b && vite build
#   - test      blocking - vitest run (205 specs)
#   - coverage  blocking - vitest run --coverage (Track 2A ratchet floor)
#   - i18n      blocking - locale parity check (ADR-0001)
#   - audit     blocking - npm audit --audit-level=high
#   - lint      blocking - eslint (0 errors enforced since Track 3A)
#
# Branch protection on main requires: build, test, coverage, i18n, audit, lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on rapid pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default minimal permissions for all jobs.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + production build)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: ./dist
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Track 2A: enforces a ratchet floor (currently 12% lines, lifted
    # progressively in Track 2C and beyond). Threshold lives in
    # vitest.config.ts; see docs/research/2026-05-03-coverage-baseline.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: ./coverage
          retention-days: 14
          if-no-files-found: error

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n locale parity check (ADR-0001)
        run: npm run i18n:check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit (HIGH or CRITICAL fails)
        run: npm audit --audit-level=high

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

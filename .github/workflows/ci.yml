name: CI

# CI for Verbara Web (formerly Asterisk.Platform.Web).
# Runs on every PR + the merge queue (merge_group).
#
# Jobs (7 in parallel):
#   - build     blocking - tsc -b && vite build
#   - test      blocking - vitest run (1431 tests / 180 files)
#   - coverage  blocking - vitest run --coverage (Track 2A ratchet floor)
#   - i18n      blocking - locale parity check (ADR-0001)
#   - audit     blocking - npm audit --audit-level=high
#   - lint      blocking - eslint (0 errors enforced since Track 3A)
#   - openspec  blocking - openspec validate --all --strict
#
# Branch protection on main requires: build, test, coverage, i18n, audit, lint, openspec

# Triggers: pull_request validates each PR; merge_group runs the authoritative gate on
# the tentative merge result before it lands (merge queue). The post-merge push:[main]
# run was intentionally dropped — it re-tested the exact tree the PR/merge-queue already
# validated (pure redundancy / double-run per PR). codeql.yml keeps push:[main] for the
# security baseline on real main (the merge_group ref is not main).
on:
  pull_request:
    branches: [main]
  merge_group:

# Cancel superseded PR runs, but never cancel an in-flight merge-queue run — the
# tentative merge must be fully validated before landing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default minimal permissions for all jobs.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + production build)
        run: npm run build

      # Bundle size budget (verbara-meta/ADR-0012 Ola 2 gate #10): fail if the
      # brotli'd app JS grows past .size-limit.json's ceiling (frozen 2026-07-20 at
      # 1.45 MB, ~9% over the then-current 1.33 MB). Catches an accidental heavy
      # dependency at PR time; the ceiling ratchets down as the bundle is trimmed,
      # and raising it is a visible, reviewed decision. Reuses the dist just built.
      - name: Bundle size budget (size-limit)
        run: npm run size

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: ./dist
          retention-days: 7
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Coverage-gate-v2 (verbara-meta/ADR-0013), Web variant. Two gates over the
    # vitest v8 report emitted by `npm run test:coverage` (coverage-summary.json
    # + lcov.info):
    #   * band backstop (clause b) — check-coverage-floor.py reads
    #     coverage-summary.json: fail below floor OR above floor+slack (stale
    #     floor), plus a blocking branch floor + lines_valid_min denominator floor.
    #   * patch gate (clause a) — check-patch-coverage.py reads lcov.info: coverage
    #     of the lines changed vs origin/main must be >= coverage-floor.json.patch.
    #   * denominator guard — check-exclusion-baseline.py: net-new `c8 ignore`
    #     markers fail the build (shrinking the denominator games both gates).
    # The vitest.config.ts thresholds (29/31/16/27) STAY as a redundant fast-fail
    # liveness backstop. The required check name `coverage` is preserved.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is REQUIRED by coverage-gate-v2 (verbara-meta/ADR-0013):
          # check-patch-coverage.py needs `git merge-base origin/main HEAD`, which
          # a shallow clone cannot resolve. Works on both pull_request and
          # merge_group refs. The script's liveness self-test fails loud if this
          # is ever removed (an empty merge-base reads as a shallow clone).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install diff-cover (pinned)
        # The only new supply-chain surface for the patch gate. Pinned exactly
        # (ADR-0013). ubuntu runners ship python3 + pip.
        run: pip install --disable-pip-version-check diff_cover==10.3.0

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        # Emits ./coverage/coverage-summary.json (band) + ./coverage/lcov.info
        # (patch) via the json-summary + lcov vitest reporters.
        run: npm run test:coverage

      - name: Enforce coverage band (manual ratchet, two-sided)
        # coverage-gate-v2 backstop (ADR-0013 clause b): fail below floor OR above
        # floor+slack (stale floor), plus blocking branch floor + lines_valid_min.
        run: python3 scripts/check-coverage-floor.py ./coverage/coverage-summary.json coverage-floor.json

      - name: Enforce patch coverage (diff-cover)
        # coverage-gate-v2 primary gate (ADR-0013 clause a): coverage of the lines
        # changed vs origin/main must be >= coverage-floor.json["patch"].
        run: python3 scripts/check-patch-coverage.py ./coverage/lcov.info coverage-floor.json

      - name: Enforce coverage-exclusion baseline (denominator guard)
        # coverage-gate-v2 denominator guard (ADR-0013): net-new `c8 ignore`
        # markers fail the build (shrinking the denominator would game both gates).
        run: python3 scripts/check-exclusion-baseline.py coverage-exclusion-baseline.json .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: ./coverage
          retention-days: 14
          if-no-files-found: error

  coverage-scripts:
    name: Coverage Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Cheap (~seconds, no Node): unit-tests the three coverage-gate-v2 guard
    # scripts (verbara-meta/ADR-0013). The SyncFence precedent requires the guard
    # itself be tested. diff-cover is installed so the patch-coverage cases run
    # (they self-skip when it is absent, but CI always has it).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Install diff-cover (pinned)
        run: pip install --disable-pip-version-check diff_cover==10.3.0

      - name: Run coverage-script unit tests
        run: python3 -m unittest discover scripts/tests

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n locale parity check (ADR-0001)
        run: npm run i18n:check

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Production-scoped vuln floor (queue-required). Advisories confined to build/dev tooling that
      # never reach the shipped bundle do NOT freeze the merge queue — they are covered by the
      # non-blocking `audit-full` job below plus Dependabot's weekly npm-security group. This keeps a
      # supply-chain check off the critical delivery path per ADR-0003 §2 while still enforcing a
      # production vuln floor (ADR-0014 §2 G8). Rationale: docs/decisions/0010-audit-gate-production-scope.md.
      - name: npm audit — production deps (HIGH or CRITICAL fails)
        run: npm audit --omit=dev --audit-level=high

  audit-full:
    name: audit-full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informational, NOT queue-required (not in the main-protection required-checks set): surfaces
    # build/dev-tooling advisories (which never ship to users) for visibility without blocking
    # delivery. Remediation cadence is Dependabot's job (npm-security group). continue-on-error keeps
    # it from failing the run; the advisories appear in the step log. See docs/decisions/0010.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit — full tree (informational; build-only advisories, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      # Generated-types adoption ratchet (verbara-meta/ADR-0012 Ola 2 gate #5): fail
      # if a NEW API hook hand-maintains DTOs instead of importing the generated
      # OpenAPI types. Baseline = the 45 not-yet-migrated hooks (frozen 2026-07-20),
      # which only shrinks. Pure Node, no deps.
      - name: Generated-types adoption ratchet
        run: npm run lint:generated-types

  # OpenSpec docs gate (2026-07-04 ecosystem audit): the living specs + changes are
  # agent-edited markdown with a strict parser — validate them like code. Pinned CLI
  # version (upgrade deliberately). Runs on PR + merge_group like every other gate.
  openspec:
    name: openspec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate specs and changes (strict)
        run: npx -y @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

# The web image's nginx, installed as /etc/nginx/conf.d/default.conf and so
# included inside the image's http block.
#
# Logs without query strings (H21). The reset link (?token=), the SSE stream
# (?token=) and the SignalR hub (access_token=) carry credentials in the query,
# and so does a Referer (the reset page's ?token=). The format mirrors
# Platform's gateway (verbara_noquery in docker/nginx-gateway.conf): the path
# and only the scheme, host and path of the Referer. The path is the request's
# own, cut at its query, not $uri: try_files rewrites $uri to /index.html for
# every console route, and the log is written after it. The server block
# sends its error log nowhere, because nginx appends the request line, the
# upstream URL and the Referer, queries included, to every message it logs
# while it handles a request; a failed request still shows in the access log
# with its status (502, 504).
map $http_referer $verbara_referer_path {
    default "";
    "~^(?<p>[^?#]*)" $p;
}

map $request_uri $verbara_request_path {
    default "";
    "~^(?<p>[^?]*)" $p;
}

log_format verbara_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $verbara_request_path $server_protocol" $status $body_bytes_sent '
                           '"$verbara_referer_path" "$http_user_agent"';

# Connections to the services are reused (the same three settings as Platform's
# compose gateway). Each upstream keeps a pool of idle connections
# (`keepalive`), and every proxied location speaks HTTP/1.1 to it and replaces
# the Connection header: empty for a plain request, "upgrade" only when the
# client asks for a WebSocket ($connection_upgrade below). Without that, nginx
# closes the upstream connection after every request, each closed connection
# holds one of this container's ephemeral ports for about 60 s, and under
# sustained load (more than about 470 new connections per second) the ports
# run out and nginx answers 502. A literal `Connection "upgrade"` did the same
# to every plain request (the API calls, the hub's negotiate, long polling and
# server-sent events). nginx drops an idle pooled connection after 60 s
# (keepalive_timeout's default), before Kestrel does (130 s), so it never
# reuses a connection the server already closed. Guarded by
# scripts/tests/test_nginx_upstream_keepalive.py and the KA checks of
# scripts/web-image/check-nginx.sh.

# "upgrade" when the client asks for a WebSocket, empty otherwise, so a plain
# request to /hubs/ or /ws/ returns its upstream connection to the pool.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# keepalive 64: idle connections each worker keeps, as on the compose gateway;
# a burst wider than that opens extra connections and closes only the surplus.
# Named after the host, so /health, which sets no Host header, still sends
# Host: platform-api.
upstream platform-api {
    server platform-api:5000;
    keepalive 64;
}

# The realtime upstream (`upstream verbara_realtime`, with its own resolver),
# written at start-up by docker/18-verbara-realtime-upstream.envsh; see /hubs/.
include /var/run/verbara-realtime-upstream.conf;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log verbara_noquery;
    error_log /dev/null;

    # Track 7C — WebChat customer widget. Customers put the SDK tag on their own
    # sites, on other domains (#426): the SDK is a classic <script> loaded
    # cross-origin, and its frame /webchat/embed/ is framed by those sites. The
    # frame talks only to this origin (its API under /api/, its socket under
    # /ws/). A location with its own add_header inherits none from the server
    # block, so each of these two declares every header it sends.
    # The SDK keeps one fixed address (the snippet customers paste), so it is
    # cached briefly and revalidated: a fixed SDK reaches returning visitors
    # within minutes of a redeploy, not a year (#433).
    location /webchat/v1/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Framed by any site: frame-ancestors * and no X-Frame-Options, on this
    # location only.
    location /webchat/embed/ {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors *";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri /webchat/embed/index.html;
    }

    location = /webchat/demo.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri =404;
    }

    # The console is framed only by its own origin. Its routes all end here
    # (try_files falls back to index.html), so this covers every console page.
    location / {
        add_header Content-Security-Policy "frame-ancestors 'self'";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri $uri/ /index.html;
    }

    # No WebSocket lives under /api/ (the API's only one is /ws/), and the
    # event stream is server-sent events, a plain response: every request here
    # returns its connection to the pool.
    location /api/ {
        proxy_pass http://platform-api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        # Pass Platform's response through as sent (H14): gzip would turn its
        # strong ETag into W/"…", which Platform's If-Match never matches.
        gzip off;
    }

    # WebChat socket (#429). The widget's iframe is served by this image and opens
    # its socket at /ws/webchat/{sessionId} on its own origin; on Kubernetes that
    # host routes wholesale to this image, so without this location the handshake
    # fell to `location /` and got index.html. Behind the compose gateway /ws/
    # never reaches this image (the gateway routes it to the API itself).
    location /ws/ {
        proxy_pass http://platform-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SignalR hub (N20). The console connects to /hubs/platform on its own host;
    # on Kubernetes that host is this image, so without this location the
    # negotiate POST fell to `location /` and its static index.html (405).
    # Behind the compose gateway /hubs/ never reaches this image. The image
    # still starts where no realtime service exists: the upstream's server
    # carries `resolve`, so nginx looks the name up with its own resolver after
    # start-up and keeps looking (a request gets 502 until the name resolves),
    # where a plain upstream name that does not resolve stops nginx from
    # starting. It replaces the per-request variable proxy_pass the location
    # used before, which kept no pool. The entrypoint writes the upstream at
    # start-up (docker/18-verbara-realtime-upstream.envsh), included above,
    # under /var/run because the Helm chart runs this image with a read-only
    # root filesystem and /var/run on an emptyDir.
    location /hubs/ {
        proxy_pass http://verbara_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location /health {
        proxy_pass http://platform-api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Track 7C — WebChat customer widget
    location /webchat/v1/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /webchat/embed/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'";
        try_files $uri /webchat/embed/index.html;
    }

    location = /webchat/demo.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://platform-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://platform-api:5000/health;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}

# The web image's nginx, installed as /etc/nginx/conf.d/default.conf and so
# included inside the image's http block.
#
# Logs without query strings (H21). The reset link (?token=), the SSE stream
# (?token=) and the SignalR hub (access_token=) carry credentials in the query,
# and so does a Referer (the reset page's ?token=). The format mirrors
# Platform's gateway (verbara_noquery in docker/nginx-gateway.conf): the path
# and only the scheme, host and path of the Referer. The path is the request's
# own, cut at its query, not $uri: try_files rewrites $uri to /index.html for
# every console route, and the log is written after it. The server block
# sends its error log nowhere, because nginx appends the request line, the
# upstream URL and the Referer, queries included, to every message it logs
# while it handles a request; a failed request still shows in the access log
# with its status (502, 504).
map $http_referer $verbara_referer_path {
    default "";
    "~^(?<p>[^?#]*)" $p;
}

map $request_uri $verbara_request_path {
    default "";
    "~^(?<p>[^?]*)" $p;
}

log_format verbara_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $verbara_request_path $server_protocol" $status $body_bytes_sent '
                           '"$verbara_referer_path" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log verbara_noquery;
    error_log /dev/null;

    # Track 7C — WebChat customer widget
    location /webchat/v1/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /webchat/embed/ {
        add_header Cache-Control "public, max-age=300";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'";
        try_files $uri /webchat/embed/index.html;
    }

    location = /webchat/demo.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://platform-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        # Pass Platform's response through as sent (H14): gzip would turn its
        # strong ETag into W/"…", which Platform's If-Match never matches.
        gzip off;
    }

    # SignalR hub (N20). The console connects to /hubs/platform on its own host;
    # on Kubernetes that host is this image, so without this location the
    # negotiate POST fell to `location /` and its static index.html (405).
    # Behind the compose gateway /hubs/ never reaches this image. The upstream
    # is resolved per request, so the image starts where no realtime service
    # exists. The included file sets `resolver` and $verbara_realtime; the
    # entrypoint writes it at start-up (docker/18-verbara-realtime-upstream.envsh),
    # under /var/run because the Helm chart runs this image with a read-only root
    # filesystem and /var/run on an emptyDir.
    location /hubs/ {
        include /var/run/verbara-realtime-upstream.conf;
        proxy_pass http://$verbara_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    location /health {
        proxy_pass http://platform-api:5000/health;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
